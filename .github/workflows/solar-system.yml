name: solar-system-workflow

on:
  workflow_dispatch:

jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
            node-version: '22'

        - name: Install Dependencies
          run: npm install

        - name: Unit Testing
          run: npm test