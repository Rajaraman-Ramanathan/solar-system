name: solar-system-workflow

on:
  workflow_dispatch:

env:
    MONGO_URI: ${{ vars.MONGO_URI }}
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    secret-scan:
      name: Secret Scanning (GitLeaks)
      runs-on: ubuntu-latest
      steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --config .gitleaks.toml --source . --report-format json --report-path gitleaks-report.json || true
      - name: Upload GitLeaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 1

    dependency-scan:
      name: Dependency Vulnerability Scan
      runs-on: ubuntu-latest

      steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

    codeql-analysis:
      name: Static Code Analysis (CodeQL)
      runs-on: ubuntu-latest
      permissions:
        actions: read
        contents: read
        security-events: write
      steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

    unit-testing:
        name: Unit Testing
        needs: [secret-scan, dependency-scan, codeql-analysis]
        strategy:
          matrix:
            node_version: [21, 22]
            operating_system: [ubuntu-latest, macos-latest]
            exclude:
              - node_version: 21
                operating_system: macos-latest
              - node_version: 21
                operating_system: ubuntu-latest
              - node_version: 22
                operating_system: macos-latest
        runs-on: ${{ matrix.operating_system }}

        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: ${{ matrix.node_version }}
        - name: Cache npm dependencies
          uses: actions/cache@v3
          with:
            path: node_modules
            key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}
        - name: Install Dependencies
          run: npm install
        - name: Unit Testing
          id: test
          run: npm test
        - name: Archive Test Results
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Results-${{ matrix.operating_system }}-node${{ matrix.node_version }}
            path: test-results.xml
            retention-days: 1
        
    coverage-report:
        name: Coverage Report
        needs: [secret-scan, dependency-scan, codeql-analysis]
        runs-on: ubuntu-latest

        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Cache npm dependencies
          uses: actions/cache@v3
          with:
            path: node_modules
            key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}
        - name: Install Dependencies
          run: npm install
        - name: Generate Coverage Report
          run: npm run coverage
          continue-on-error: true
        - name: Archive Coverage Report
          uses: actions/upload-artifact@v4
          with:
            name: Coverage-Report
            path: coverage/
            retention-days: 1

    docker:
        name: Docker Login
        needs: [unit-testing, coverage-report]
        runs-on: ubuntu-latest

        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Log in to Docker Hub
          uses: docker/login-action@v2
          with:
            username: ${{ vars.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
        - name: Build Docker Image
          uses: docker/build-push-action@v4
          with:
            context: .
            push: false
            tags: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
        - name: Run Container and Execute Tests
          run: |
            docker run -d \
            -p 3000:3000 \
            --name solar-system-app \
            -e MONGO_URI=${{ vars.MONGO_URI }} \
            -e MONGO_USERNAME=${{ vars.MONGO_USERNAME }} \
            -e MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }} \
            ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
            sleep 5
            echo "Running tests against the Docker container..."
            wget -q -O - 127.0.0.1:3000/live | grep "live"
        - name: Docker Push
          uses: docker/build-push-action@v4
          with:
            context: .
            push: true
            tags: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

    image-scan:
      name: Container Image Scan
      needs: [docker]
      runs-on: ubuntu-latest

      steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull built image
        run: docker pull ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
          format: table
          vuln-type: os,library
          exit-code: 0

    iac-scan:
      name: IaC Misconfiguration Scan
      needs: [docker]
      runs-on: ubuntu-latest
      
      steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run KICS Scan
        uses: Checkmarx/kics-github-action@v2.1.14
        with:
          path: .
          output_path: kics-results.json
          fail_on: high