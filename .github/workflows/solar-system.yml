name: solar-system-workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
            node-version: '22'

        - name: Install dependencies
          run: npm install

        - name: Run tests
          run: npm test